# Build and publish the Linux arm64 AppImages + the updater manifest on every
# version tag, so a fork can self-update from its own GitHub Releases.
#
#   git tag v0.14.0 && git push origin v0.14.0
#     -> Release "v0.14.0" with:
#          OpenhpsdrZeus-0.14.0-linux-aarch64.AppImage
#          OpenhpsdrZeus-Server-0.14.0-linux-aarch64.AppImage
#          latest.json        (RepoUpdateService manifest schema)
#
# The appliance then points the STOCK updater at the stable alias URL:
#   ZEUS_UPDATE_MANIFEST_URL=https://github.com/<owner>/<repo>/releases/latest/download/latest.json
# `releases/latest/download/<asset>` always redirects to the newest release,
# so the URL never changes across versions. The manifest is produced by the
# same tools/update-download-manifest.mjs the upstream pipeline uses, so the
# fields (version/assets/url/size/sha256) match RepoUpdateService exactly and
# the release guards (sha256 verification) stay effective.

name: release-appimage

on:
  # A tag publishes, as it always did. The two manual workflows
  # (release-draft / release-publish) exist to rehearse a release before
  # tagging: assemble it as a draft, look at it, then tag for real.
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.87)."
        required: true
        type: string
      draft:
        description: "Attach to a draft release rather than publishing."
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.87)."
        required: true
        type: string
      draft:
        description: "Attach to a draft release rather than publishing."
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  # See Directory.Build.props: a release build must say so explicitly.
  # Workflow-level so every job inherits it, including jobs added later.
  ZEUS_RELEASE_BUILD: "true"

jobs:
  # v1.85 shipped a libzeus_ft8 older than the measured-SNR fix and v1.86 a
  # libzeus_wspr older than the stack-overflow fix, both down this path. The
  # check is seconds; the build is not, so it goes first.
  freshness:
    name: Native binaries are not older than their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}
          # Compares commit dates, so it needs the history.
          fetch-depth: 0

      - name: Check native freshness
        run: bash tools/check-native-freshness.sh

  build:
    needs: freshness
    # Native arm64 runner — the existing installer script runs unmodified.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          # Without this the manual handle built the default branch,
          # not the tag it was given.
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # On dispatch, build the TAG's tree (not the branch head) so the
      # release matches what the tag names.
      - name: Check out dispatched tag
        if: github.event_name == 'workflow_dispatch'
        # Let the checkout action do this natively: hand-rolled git in a
        # shallow actions/checkout clone produced exit 1 (tagless clone),
        # then exit 128 (git's own error class) across two hand-cranked
        # runs. The action handles tag refs and shallow bookkeeping itself.
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Build the operator's manual PDF so the installer script stages it into
      # the AppImage (About -> Open the User Manual). Chromium is the headless
      # print engine; the arm runner image does not ship a browser.
      - name: Build operator's manual PDF
        env:
          MANUAL_CHROME_EXTRA_FLAGS: "--no-sandbox --disable-dev-shm-usage"
        run: |
          # NOT apt: on Ubuntu 24.04, chromium-browser is a snap-transitional
          # stub — apt reports success, build.sh's `command -v` finds the
          # binary, and it dies at print time with "requires the chromium
          # snap". The || fallback never fires because the first install
          # "succeeded". Install the real snap directly.
          sudo snap install chromium
          chmod +x docs/manual/build.sh
          docs/manual/build.sh

      - name: Build AppImages (linux-arm64)
        env:
          # appimagetool is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          bash installers/create-linux-desktop-appimage.sh \
            "${{ steps.ver.outputs.version }}" linux-arm64
          ls -la installers/output/OpenhpsdrZeus*.AppImage

      - name: Generate updater manifest (latest.json)
        env:
          # On dispatch, ref_name is the BRANCH — the manifest must point at
          # the release tag's download path or every updater would 404.
          DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          ZEUS_DOWNLOAD_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p /tmp/release-artifacts
          # Only Zeus's own AppImages: the build script caches the downloaded
          # appimagetool-<arch>.AppImage in the same folder, and a bare
          # *.AppImage shipped that build tool as a release download.
          cp installers/output/OpenhpsdrZeus*.AppImage /tmp/release-artifacts/
          echo '{}' > /tmp/empty-manifest.json
          node tools/update-download-manifest.mjs \
            /tmp/release-artifacts /tmp/empty-manifest.json /tmp/release-artifacts/latest.json
          # The tool emits upstream's CDN layout (…/versions/X.Y.Z/<file>);
          # GitHub release assets are flat under the release tag. Rewrite each
          # asset url to ${DOWNLOAD_BASE_URL}/<filename>.
          node -e '
            const fs = require("fs");
            const p = "/tmp/release-artifacts/latest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            const base = process.env.DOWNLOAD_BASE_URL.replace(/\/$/, "");
            for (const a of m.assets) a.url = base + "/" + a.filename;
            fs.writeFileSync(p, JSON.stringify(m, null, 2));
          '
          cat /tmp/release-artifacts/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name != 'push' && inputs.draft }}
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          files: |
            /tmp/release-artifacts/*.AppImage
            /tmp/release-artifacts/latest.json
          generate_release_notes: true
